spring.application.name=lab15

server.port=3000

# ---- Aiven MySQL connection ----
# Replace HOST, PORT, USER and PASSWORD with the values from your Aiven service "Overview" page.
# Use se411db (the database you created) or defaultdb if you did not create one.
spring.datasource.url=jdbc:mysql://localhost:3306/se411db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Run schema.sql and data.sql on every start (H2 did this automatically, MySQL needs it explicitly)
spring.sql.init.mode=always
