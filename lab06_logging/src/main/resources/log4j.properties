# Minimum level to record: ERROR < WARN < INFO < DEBUG (try each one)
log4j.rootLogger=DEBUG, LOG1, CONSOLE

# File appender -> ./logs/App/log4j/log.out
log=./logs/App/log4j
log4j.appender.LOG1=org.apache.log4j.FileAppender
log4j.appender.LOG1.File=${log}/log.out
log4j.appender.LOG1.layout=org.apache.log4j.PatternLayout
log4j.appender.LOG1.layout.conversionPattern=%d %p [%t] %C - %m%n

# Optional: also print to the console so you don't have to open the file
log4j.appender.CONSOLE=org.apache.log4j.ConsoleAppender
log4j.appender.CONSOLE.layout=org.apache.log4j.PatternLayout
log4j.appender.CONSOLE.layout.conversionPattern=%d %p [%t] %C - %m%n
